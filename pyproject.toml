[project]
name = "bot-suporte"
version = "0.1.0"
description = "Bot de suporte com RAG, escalonamento para humano e avaliação automática (portfólio Armazém Agreste)"
readme = "README.md"
authors = [
    { name = "bispo", email = "bishoppython@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bot = "bot_suporte.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # lista de stopwords como string é mais legível

[tool.mypy]
strict = true
packages = ["bot_suporte"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
