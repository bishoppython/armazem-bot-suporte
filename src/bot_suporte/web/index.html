<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armazém Agreste · Atendimento</title>
<style>
  :root { --fundo:#efeae2; --topo:#075e54; --eu:#d9fdd3; --bot:#fff; --texto:#111b21; --sutil:#667781; --alerta:#fff4ce; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#0b141a; --topo:#202c33; --eu:#005c4b; --bot:#202c33; --texto:#e9edef; --sutil:#8696a0; --alerta:#3b3417; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--fundo); color:var(--texto); height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--topo); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; }
  header .avatar { width:40px; height:40px; border-radius:50%; background:#25d366; display:grid; place-items:center; font-weight:700; }
  header small { display:block; opacity:.8; font-size:12px; }
  main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:80%; padding:8px 12px; border-radius:8px; white-space:pre-wrap; box-shadow:0 1px .5px rgba(0,0,0,.13); }
  .eu { align-self:flex-end; background:var(--eu); }
  .bot { align-self:flex-start; background:var(--bot); }
  .meta { font-size:11.5px; color:var(--sutil); margin-top:4px; }
  .escalou { background:var(--alerta); }
  .msg img { display:block; max-width:220px; border-radius:6px; margin-top:8px; }
  form { display:flex; gap:8px; padding:12px 16px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:24px; border:none; font:inherit; background:var(--bot); color:var(--texto); }
  button { border:none; border-radius:50%; width:46px; height:46px; background:#00a884; color:#fff; font-size:18px; cursor:pointer; }
  .sugestoes { display:flex; flex-wrap:wrap; gap:6px; }
  .sugestoes button { width:auto; height:auto; border-radius:16px; padding:6px 12px; font-size:13px; background:var(--bot); color:var(--texto); }
</style>
</head>
<body>
<header><div class="avatar">AA</div><div>Armazém Agreste<small>assistente virtual · empresa fictícia de demonstração</small></div></header>
<main id="chat">
  <div class="msg bot">Oi! Sou a assistente virtual do Armazém Agreste. Posso ajudar com produtos, preços, atacado, prazos, trocas e personalização.</div>
  <div class="sugestoes">
    <button>Qual o pedido mínimo no atacado?</button>
    <button>Quanto custa a camiseta?</button>
    <button>Vocês fazem camiseta com a minha logo?</button>
    <button>Quero falar com um atendente</button>
  </div>
</main>
<form id="form"><input id="texto" autocomplete="off" placeholder="Mensagem" maxlength="1000"><button aria-label="Enviar">➤</button></form>
<script>
  const chat = document.getElementById('chat'), form = document.getElementById('form'), campo = document.getElementById('texto');
  let conversa = null;
  try { conversa = sessionStorage.getItem('conversa'); } catch (e) {}
  const motivos = { pedido_humano:'pedido do cliente', tema_sensivel:'tema sensível', baixa_confianca:'sem confiança na resposta', sem_resposta:'resposta fora dos documentos' };
  function bolha(texto, classe) {
    const d = document.createElement('div'); d.className = 'msg ' + classe; d.textContent = texto; chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight; return d;
  }
  async function enviar(texto) {
    bolha(texto, 'eu'); const espera = bolha('digitando…', 'bot');
    try {
      const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mensagem:texto, conversa_id:conversa }) });
      const j = await r.json(); conversa = j.conversa_id;
      try { sessionStorage.setItem('conversa', conversa); } catch (e) {}
      espera.textContent = j.resposta;
      if (j.escalou) espera.classList.add('escalou');
      for (const src of j.imagens || []) { const img = document.createElement('img'); img.src = src; img.alt = 'foto do produto'; espera.appendChild(img); }
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = j.escalou ? `→ passado para atendente (${motivos[j.motivo] || j.motivo})` : `fontes: ${j.fontes.join(', ')} · confiança ${j.confianca}`;
      espera.appendChild(meta);
    } catch (e) { espera.textContent = 'Falha ao falar com o servidor.'; }
    chat.scrollTop = chat.scrollHeight;
  }
  form.addEventListener('submit', e => { e.preventDefault(); const t = campo.value.trim(); if (t) { campo.value = ''; enviar(t); } });
  document.querySelectorAll('.sugestoes button').forEach(b => b.addEventListener('click', () => enviar(b.textContent)));
</script>
</body>
</html>
